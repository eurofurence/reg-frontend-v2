log_format json '{ "@timestamp":"$time_iso8601", "log.level": "INFO", "remoteIP":"$remote_addr", "host":"$host", "requestPath":"$uri", "query":"$query_string", "method":"$request_method", "status":"$status", "userAgent":"$http_user_agent", "referer":"$http_referer" }';

server {
    listen 8080;
    server_name ${NGINX_CONF_SERVER_NAME};
    root /usr/share/nginx/html;
    index index.html;

    # Runtime path-prefix substitution in served html/js/css (env: NGINX_CONF_PATH_PREFIX)
    sub_filter_once off;
    sub_filter_types text/css application/javascript;
    sub_filter '__PATH_PREFIX__' '${NGINX_CONF_PATH_PREFIX}';

    # Maintenance switch (env: NGINX_CONF_MAINTENANCE, non-empty = on)
    set $maintenance "${NGINX_CONF_MAINTENANCE}";
    error_page 503 =503 @maintenance;
    location @maintenance {
        internal;
        rewrite ^ /maintenance.html break;
    }

    # Offline switch (env: NGINX_CONF_OFFLINE, non-empty = on)
    set $offline "${NGINX_CONF_OFFLINE}";

    # Security headers
    add_header Content-Security-Policy "default-src 'self' identity.eurofurence.org 'unsafe-inline'; img-src 'self' data: ; font-src 'self' data: ;" always;
    server_tokens off;

    # Logging
    error_log /dev/stdout warn;
    access_log /dev/stdout json;

    # Health checks probe the root, so answer there without revealing the app or its prefix
    location = / {
        default_type text/plain;
        return 200 'Nothing here!';
    }

    location / {
        return 404;
    }

    # API proxy endpoints (equivalent to the Apache proxy rules)
    location /${NGINX_CONF_PATH_PREFIX}/regsys {
        # Remove security headers that might leak API keys
        proxy_set_header X-Api-Key "";
        proxy_set_header X-Admin-Request "";

        proxy_pass http://regsys-classic:8080;
        proxy_connect_timeout 20;
        proxy_read_timeout 180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /${NGINX_CONF_PATH_PREFIX}/attsrv/ {
        proxy_set_header X-Api-Key "";
        proxy_set_header X-Admin-Request "";

        proxy_pass http://attendee-service:8080/;
        proxy_connect_timeout 20;
        proxy_read_timeout 60;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /${NGINX_CONF_PATH_PREFIX}/authsrv/ {
        proxy_set_header X-Api-Key "";
        proxy_set_header X-Admin-Request "";

        proxy_pass http://auth-service:8080/;
        proxy_connect_timeout 20;
        proxy_read_timeout 60;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /${NGINX_CONF_PATH_PREFIX}/paygatesrv/ {
        proxy_set_header X-Api-Key "";
        proxy_set_header X-Admin-Request "";

        proxy_pass http://paygate-adapter:8080/;
        proxy_connect_timeout 20;
        proxy_read_timeout 60;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /${NGINX_CONF_PATH_PREFIX}/mailsrv/ {
        proxy_set_header X-Api-Key "";
        proxy_set_header X-Admin-Request "";

        proxy_pass http://mail-service:8080/;
        proxy_connect_timeout 20;
        proxy_read_timeout 60;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /${NGINX_CONF_PATH_PREFIX}/roomsrv/ {
        proxy_set_header X-Api-Key "";
        proxy_set_header X-Admin-Request "";

        proxy_pass http://room-service:8080/;
        proxy_connect_timeout 20;
        proxy_read_timeout 60;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /${NGINX_CONF_PATH_PREFIX}/paysrv/ {
        proxy_set_header X-Api-Key "";
        proxy_set_header X-Admin-Request "";

        proxy_pass http://payment-service:8080/;
        proxy_connect_timeout 20;
        proxy_read_timeout 60;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Onsite UI proxy
    location /${NGINX_CONF_PATH_PREFIX}/onsite {
        proxy_pass http://onsite:8000/${NGINX_CONF_PATH_PREFIX}/onsite;
        proxy_connect_timeout 20;
        proxy_read_timeout 60;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The app is only reachable under the secret prefix; its files live in /app/
    location ^~ /${NGINX_CONF_PATH_PREFIX}/app/ {
        if ($maintenance) {
            return 503;
        }
        if ($offline) {
            rewrite ^ /offline.html break;
        }
        rewrite ^/${NGINX_CONF_PATH_PREFIX}(/app/.*)$ $1 last;
    }

    location ^~ /app/ {
        internal;
        try_files $uri /app/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            internal;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # Error pages
    error_page 404 /404.html;
}

